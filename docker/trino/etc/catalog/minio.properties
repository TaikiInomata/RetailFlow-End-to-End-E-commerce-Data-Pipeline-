# ============================================================
# Trino Delta Lake Catalog — kết nối đến MinIO (S3-compatible)
# ============================================================

# Connector: Delta Lake (đọc/ghi trực tiếp file Delta trên MinIO)
connector.name=delta_lake

# ── Metastore ──────────────────────────────────────────────
# Thrift service: Hive Metastore Server cho concurrency
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083

# ── S3 / MinIO ─────────────────────────────────────────────
# Dùng native S3 file system (trinodb/trino:435+)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.region=us-east-1
# Bắt buộc với MinIO: dùng path-style (không phải virtual-hosted-style)
s3.path-style-access=true

# ── Delta Lake ─────────────────────────────────────────────
# Cho phép write với file-based metastore (single writer)
delta.enable-non-concurrent-writes=true
delta.register-table-procedure.enabled=true

# ── Performance ────────────────────────────────────────────
# Cache metadata để giảm số lần gọi S3 LIST
hive.metastore-cache-ttl=10m
hive.metastore-refresh-interval=5m