version: '3.8'

networks:
  retailflow_network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: retailflow_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - "./pg_data:/var/lib/postgresql/data"  
    networks:
      - retailflow_network
