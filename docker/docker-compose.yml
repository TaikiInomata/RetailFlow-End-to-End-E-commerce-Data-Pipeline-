name: retailflow

networks:
  retailflow_network:
    driver: bridge

volumes:
  retailflow_db_volume:
    driver: local
  retailflow_zookeeper_data:
    driver: local
  retailflow_zookeeper_log:
    driver: local
  retailflow_kafka_data:
    driver: local
  retailflow_minio_data:
    driver: local
  retailflow_airflow_db:
    driver: local

# ==========================================
# YAML ANCHOR: Cấu hình chung cho cụm Airflow
# → Dùng <<: *airflow-common để kế thừa vào từng service
# ==========================================
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  profiles:
    - airflow
  environment: &airflow-env                           # Anchor riêng cho phần environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  volumes:
    - ../dags:/opt/airflow/dags           # Bind mount: thư mục DAG thật trên máy host
    - ../scripts:/opt/airflow/scripts     # Bind mount: để DAG gọi được scripts Python
  depends_on:
    postgres-airflow:
      condition: service_healthy
  networks:
    - retailflow_network

services:
  # =========================================
  # POSTGRES - Source Database (OLTP)
  # =========================================
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: retailflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: [ 
     "postgres", 
     "-c", "wal_level=logical", 
     "-c", "max_wal_senders=${PG_MAX_WAL_SENDERS}", 
     "-c", "max_replication_slots=${PG_MAX_REPLICATION_SLOTS}", 
     "-c", "wal_keep_size=${PG_WAL_KEEP_SIZE}" 
     ]
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - retailflow_db_volume:/var/lib/postgresql/data
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s # Cứ 10 giây hỏi một lần
      timeout: 5s # Đợi 5 giây nếu không trả lời coi như fail
      retries: 5 # Hỏi 5 lần mà fail thì kết luận container đã sập
      start_period: 20s
  # =========================================
  # ZOOKEEPER - Người quản lý cụm (Cluster Manager)
  # =========================================
  zookeeper:
    image: ${ZOOKEEPER_IMAGE}
    container_name: retailflow_zookeeper
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"  # Bật lệnh ruok cho healthcheck
    volumes:
      - retailflow_zookeeper_data:/var/lib/zookeeper/data
      - retailflow_zookeeper_log:/var/lib/zookeeper/log
    networks:
      - retailflow_network
    healthcheck:
      # Dùng bash /dev/tcp thay vì nc vì image confluentinc không có nc (netcat)
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2181; echo ruok >&3; grep -q imok <&3" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # =========================================
  # KAFKA - Trạm trung chuyển dữ liệu (Message Broker)
  # =========================================
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: retailflow_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT}:9092"
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_REBALANCE_DELAY}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # --- Disk Protection: Kafka Retention ---
      # Xóa messages cũ hơn 48 giờ để tránh tích lũy vô hạn
      KAFKA_LOG_RETENTION_HOURS: 48
      # Giới hạn tổng dung lượng mỗi topic-partition tối đa 200MB
      KAFKA_LOG_RETENTION_BYTES: 209715200
      # Kích thước mỗi segment file (10MB) — giúp việc xóa file cũ granular hơn
      KAFKA_LOG_SEGMENT_BYTES: 10485760
    volumes:
      - retailflow_kafka_data:/var/lib/kafka/data
    networks:
      - retailflow_network
    healthcheck:
      # Dùng cub kafka-ready thay vì kafka-topics vì cub nhẹ hơn (không khởi động JVM mới mỗi lần check)
      test: [ "CMD", "bash", "-c", "cub kafka-ready -b localhost:29092 1 20" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: retailflow_kafka_ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=RetailFlow-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092        
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME=debezium-connector
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS=http://debezium:8083
    networks:
      - retailflow_network
  # =========================================
  # DEBEZIUM - CDC Tool
  # =========================================
  debezium:
    build:
      context: .                    # Build context là thư mục docker/
      dockerfile: debezium/Dockerfile  # Custom image: Debezium + Confluent S3 Sink
    container_name: retailflow_debezium
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${DEBEZIUM_PORT}:8083"
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ${DEBEZIUM_GROUP_ID}
      CONFIG_STORAGE_TOPIC: ${DEBEZIUM_CONFIG_TOPIC}
      OFFSET_STORAGE_TOPIC: ${DEBEZIUM_OFFSET_TOPIC}
      STATUS_STORAGE_TOPIC: ${DEBEZIUM_STATUS_TOPIC}
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONFIG_STORAGE_REPLICATION_FACTOR: ${DEBEZIUM_REPLICATION_FACTOR}
      OFFSET_STORAGE_REPLICATION_FACTOR: ${DEBEZIUM_REPLICATION_FACTOR}
      STATUS_STORAGE_REPLICATION_FACTOR: ${DEBEZIUM_REPLICATION_FACTOR}
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Cần thiết để S3 Sink Connector resolve ${env:MINIO_ROOT_USER} và ${env:MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CONNECT_TOPIC_CREATION_ENABLE: 'true'
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD", "bash", "-c", "curl -sf http://localhost:8083/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
  # =========================================
  # MINIO - Object Storage (Data Lake)
  # ========================================= 
  minio:
    image: ${MINIO_IMAGE}
    container_name: retailflow_minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_UI_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - retailflow_minio_data:/data
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  # =========================================
  # SPARK STREAMING — Bronze Layer (Always-On)
  # Đọc Clickstream từ Kafka → ghi Parquet xuống MinIO liên tục
  # =========================================
  spark-streaming:
    build:
      context: ..                              # Build context: project root (để COPY hoạt động đúng)
      dockerfile: docker/spark/Dockerfile
    container_name: retailflow_spark_streaming
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../.env                                # Credentials (passwords, keys)
      - ../.env.docker                         # Docker networking overrides (KAFKA_BROKER, MINIO_ENDPOINT...)
    environment:
      RUNNING_IN_DOCKER: "true"                # Bỏ qua HADOOP_HOME workaround cho Windows
    networks:
      - retailflow_network
  # =========================================
  # SIMULATION — On-Demand (Chạy thủ công khi muốn giả lập)
  # Khởi động: docker compose --profile simulation up simulation -d
  # Dừng:      docker compose stop simulation
  # =========================================
  simulation:
    build:
      context: ..
      dockerfile: docker/simulation/Dockerfile
    container_name: retailflow_simulation
    profiles:
      - simulation                             # KHÔNG tự khởi động khi docker compose up -d
    restart: "no"                              # Tắt auto-restart — chạy xong là dừng
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
      - ../.env.docker
    environment:
      CLICKSTREAM_MAX_EVENTS: "100000"         # Tự dừng sau 100k events (~50MB Parquet)
      SIMULATION_MAX_HOURS: "4"                 # Tự dừng sau 4 giờ dù chưa đạt max events
    networks:
      - retailflow_network
  # =========================================
  # SETUP INIT CONTAINER (Chạy 1 lần rồi tắt)
  # =========================================
  setup-init:
    build:
      context: ..
      dockerfile: docker/setup/Dockerfile
    container_name: retailflow_setup
    profiles:
      - setup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      debezium:
        condition: service_healthy
    env_file:
      - ../.env
      - ../.env.docker
    networks:
      - retailflow_network

  # =========================================
  # CỤM APACHE AIRFLOW
  # =========================================

  # 1. METADATA DATABASE (Riêng biệt với OLTP Postgres)
  postgres-airflow:
    image: postgres:15
    container_name: retailflow_postgres_airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    ports:
      - "${AIRFLOW_DB_PORT}:5432"                # Tránh xung đột với Postgres OLTP (5432)
    volumes:
      - retailflow_airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailflow_network

  # 2. KHỞI TẠO: Tạo bảng metadata + tạo user admin (Chạy 1 lần)
  airflow-init:
    <<: *airflow-common                              # Kế thừa: image, profiles, volumes, depends_on, networks
    container_name: retailflow_airflow_init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@retailflow.local
    environment:
      <<: *airflow-env                               # Kế thừa env chung, thêm biến riêng bên dưới
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  # 3. GIAO DIỆN WEB
  airflow-webserver:
    <<: *airflow-common                              # Kế thừa: image, profiles, volumes, depends_on, networks
    container_name: retailflow_airflow_webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"             # Tránh xung đột với Kafka UI (8080)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 4. BỘ LẬP LỊCH
  airflow-scheduler:
    <<: *airflow-common                              # Kế thừa: image, profiles, volumes, depends_on, networks
    container_name: retailflow_airflow_scheduler
    restart: unless-stopped
    command: scheduler