name: retailflow

networks:
  retailflow_network:
    driver: bridge

volumes:
  retailflow_db_volume:
    driver: local
  retailflow_zookeeper_data:
    driver: local
  retailflow_zookeeper_log:
    driver: local
  retailflow_kafka_data:
    driver: local
  retailflow_minio_data:
    driver: local

services:
  # =========================================
  # POSTGRES - Source Database (OLTP)
  # =========================================
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: retailflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: [ 
     "postgres", 
     "-c", "wal_level=logical", 
     "-c", "max_wal_senders=${PG_MAX_WAL_SENDERS}", 
     "-c", "max_replication_slots=${PG_MAX_REPLICATION_SLOTS}", 
     "-c", "wal_keep_size=${PG_WAL_KEEP_SIZE}" 
     ]
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - retailflow_db_volume:/var/lib/postgresql/data
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s # Cứ 10 giây hỏi một lần
      timeout: 5s # Đợi 5 giây nếu không trả lời coi như fail
      retries: 5 # Hỏi 5 lần mà fail thì kết luận container đã sập
      start_period: 20s
  # =========================================
  # ZOOKEEPER - Người quản lý cụm (Cluster Manager)
  # =========================================
  zookeeper:
    image: ${ZOOKEEPER_IMAGE}
    container_name: retailflow_zookeeper
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"  # Bật lệnh ruok cho healthcheck
    volumes:
      - retailflow_zookeeper_data:/var/lib/zookeeper/data
      - retailflow_zookeeper_log:/var/lib/zookeeper/log
    networks:
      - retailflow_network
    healthcheck:
      # Dùng bash /dev/tcp thay vì nc vì image confluentinc không có nc (netcat)
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2181; echo ruok >&3; grep -q imok <&3" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # =========================================
  # KAFKA - Trạm trung chuyển dữ liệu (Message Broker)
  # =========================================
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: retailflow_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT}:9092"
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_REBALANCE_DELAY}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - retailflow_kafka_data:/var/lib/kafka/data
    networks:
      - retailflow_network
    healthcheck:
      # Dùng cub kafka-ready thay vì kafka-topics vì cub nhẹ hơn (không khởi động JVM mới mỗi lần check)
      test: [ "CMD", "bash", "-c", "cub kafka-ready -b localhost:29092 1 20" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: retailflow_kafka_ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=RetailFlow-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092        
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME=debezium-connector
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS=http://debezium:8083
    networks:
      - retailflow_network
  # =========================================
  # DEBEZIUM - CDC Tool
  # =========================================
  debezium:
    build:
      context: .                    # Build context là thư mục docker/
      dockerfile: debezium/Dockerfile  # Custom image: Debezium + Confluent S3 Sink
    container_name: retailflow_debezium
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${DEBEZIUM_PORT}:8083"
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ${DEBEZIUM_GROUP_ID}
      CONFIG_STORAGE_TOPIC: ${DEBEZIUM_CONFIG_TOPIC}
      OFFSET_STORAGE_TOPIC: ${DEBEZIUM_OFFSET_TOPIC}
      STATUS_STORAGE_TOPIC: ${DEBEZIUM_STATUS_TOPIC}
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONFIG_STORAGE_REPLICATION_FACTOR: ${DEBEZIUM_REPLICATION_FACTOR}
      OFFSET_STORAGE_REPLICATION_FACTOR: ${DEBEZIUM_REPLICATION_FACTOR}
      STATUS_STORAGE_REPLICATION_FACTOR: ${DEBEZIUM_REPLICATION_FACTOR}
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Cần thiết để S3 Sink Connector resolve ${env:MINIO_ROOT_USER} và ${env:MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CONNECT_TOPIC_CREATION_ENABLE: 'true'
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD", "bash", "-c", "curl -sf http://localhost:8083/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
  # =========================================
  # MINIO - Object Storage (Data Lake)
  # ========================================= 
  minio:
    image: ${MINIO_IMAGE}
    container_name: retailflow_minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_UI_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - retailflow_minio_data:/data
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s