networks:
  retailflow_network:
    driver: bridge

volumes:
  retailflow_db_volume:
    driver: local
  retailflow_zookeeper_data:
    driver: local
  retailflow_zookeeper_log:
    driver: local
  retailflow_kafka_data:
    driver: local

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: retailflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=${PG_MAX_WAL_SENDERS}", "-c", "max_replication_slots=${PG_MAX_REPLICATION_SLOTS}", "-c", "wal_keep_size=${PG_WAL_KEEP_SIZE}" ]
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - retailflow_db_volume:/var/lib/postgresql/data
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s # Cứ 10 giây hỏi một lần
      timeout: 5s # Đợi 5 giây nếu không trả lời coi như fail
      retries: 5 # Hỏi 5 lần mà fail thì kết luận container đã sập
      start_period: 20s
  # =========================================
  # ZOOKEEPER - Người quản lý cụm (Cluster Manager)
  # =========================================
  zookeeper:
    image: ${ZOOKEEPER_IMAGE}
    container_name: retailflow_zookeeper
    ports:
      - "${ZOOKEEPER_PORT}:${ZOOKEEPER_CLIENT_PORT}"
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    volumes:
      - retailflow_zookeeper_data:/var/lib/zookeeper/data
      - retailflow_zookeeper_log:/var/lib/zookeeper/log
    networks:
      - retailflow_network
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok | nc -w 2 localhost ${ZOOKEEPER_CLIENT_PORT} | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # =========================================
  # KAFKA - Trạm trung chuyển dữ liệu (Message Broker)
  # =========================================
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: retailflow_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT}:${KAFKA_CLIENT_PORT}"
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:${ZOOKEEPER_CLIENT_PORT}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},PLAINTEXT_HOST://${KAFKA_HOST}:${KAFKA_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_REBALANCE_DELAY}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - retailflow_kafka_data:/var/lib/kafka/data
    networks:
      - retailflow_network
    healthcheck:
      # Healthcheck chạy BÊN TRONG container → dùng localhost + KAFKA_INTERNAL_PORT (PLAINTEXT listener)
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:${KAFKA_INTERNAL_PORT} --list || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
